<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="sidebar card">
      <h1>💗 Financial Tracker</h1>
      <p class="subtitle">Plan your money with confidence.</p>
      <div class="quick-stats">
        <div><span>Total Assets</span><strong id="assets-total">$0.00</strong></div>
        <div><span>Total Debt</span><strong id="debt-total">$0.00</strong></div>
        <div><span>Net Worth</span><strong id="net-total">$0.00</strong></div>
      </div>
    </aside>

    <main class="main-grid">
      <section class="card">
        <h2>Accounts</h2>
        <div id="totals" class="totals-grid"></div>
      </section>

      <section class="card">
        <h2>Update Account Balance</h2>
        <form id="account-form" class="stack">
          <label>Account Type
            <select id="account-name" required>
              <option value="Savings">Savings</option>
              <option value="Checking">Checking</option>
              <option value="Credit Card (Capital One)">Credit Card (Capital One)</option>
              <option value="HYSA (Capital One)">HYSA (Capital One)</option>
              <option value="Investments (Robinhood)">Investments (Robinhood)</option>
              <option value="Roth IRA (Robinhood)">Roth IRA (Robinhood)</option>
            </select>
          </label>
          <label>Balance ($)
            <input id="account-balance" type="number" step="0.01" required />
          </label>
          <button type="submit">Save Balance</button>
        </form>
      </section>

      <section class="card">
        <h2>Budget Planner (Monthly)</h2>
        <form id="budget-form" class="stack">
          <label>Income ($)<input id="income" type="number" step="0.01" required /></label>
          <label>Needs ($)<input id="needs" type="number" step="0.01" required /></label>
          <label>Wants ($)<input id="wants" type="number" step="0.01" required /></label>
          <label>Savings + Investing ($)<input id="savings-invest" type="number" step="0.01" required /></label>
          <button type="submit">Analyze Budget</button>
        </form>
        <p id="budget-health" class="result"></p>
      </section>

      <section class="card">
        <h2>AI Money Assistant</h2>
        <p class="helper-text">Ask for investing tips, debt strategy, or first-mortgage planning steps.</p>
        <label>OpenAI API Key
          <input id="api-key" type="password" placeholder="sk-..." />
        </label>
        <label>Your Question
          <textarea id="ai-prompt" rows="4" placeholder="Based on my balances, how should I split cash between emergency fund, Roth IRA, and down-payment savings?"></textarea>
        </label>
        <button id="ask-ai" type="button">Get Suggestions</button>
        <pre id="ai-response" class="ai-response"></pre>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
